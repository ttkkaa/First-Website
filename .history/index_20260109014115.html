<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaning Company Website</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100..1000&display=swap" rel="stylesheet">
</head>
<body>

<section class="first">

    <nav id="site-nav">
        <div class="navleftside">
            <img src="./Photos/Screenshot 2026-01-08 at 5.40 Background Removed.22 PM.png" alt="">
            <a href="/index.html"><p>The cleanic</p></a>
        </div>

        <div class="navlist">
            <ul>
                <li><a href="#">Plans</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">About</a></li>

                <div class="login">
                    <li><a href="#">Log In</a></li>
                    <li><a href="#"><i class="fa-solid fa-circle-user"></i></a></li>
                </div>
            </ul>

            <a href="#"><button>Book Now</button></a>
        </div>
    </nav>

    <div class="firsttext">
        <h1>Remarkably Cleaner. <br>Amazingly Simpler.</h1>
        <p>
            Providing spotless cleaning services for busy people <br>
            since 2035. Always on time, always smiling.
        </p>
        <button>Book Now</button>
    </div>

    <form>
        <h2>Get a Free Estimate</h2>
        <p>Contact us</p>

    </form>

</section>

    <script>
        (function(){
            const nav = document.getElementById('site-nav');
            const hero = document.querySelector('.first');
            if(!nav || !hero) return;

            function updateNavVisibility(){
                const heroBottom = hero.getBoundingClientRect().bottom + window.scrollY;
                const scrollY = window.scrollY;

                // while you're inside the hero section, keep nav visible (fixed)
                // when top of viewport passes the hero bottom, hide the nav
                if (scrollY >= heroBottom - nav.offsetHeight) {
                    nav.classList.add('nav-hidden');
                } else {
                    nav.classList.remove('nav-hidden');
                }
            }

            // initial check
            updateNavVisibility();

            // throttle with requestAnimationFrame for smoothness
            let ticking = false;
            window.addEventListener('scroll', function(){
                if(!ticking){
                    window.requestAnimationFrame(function(){
                        updateNavVisibility();
                        ticking = false;
                    });
                    ticking = true;
                }
            });
            window.addEventListener('resize', updateNavVisibility);
        })();
    </script>

</body>
</html>
